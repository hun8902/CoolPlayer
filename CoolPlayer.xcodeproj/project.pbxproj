			shellPath = /bin/sh;
			shellScript = "set -e\n\nRESOURCES_DIR=\"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH\"\nmkdir -p \"$RESOURCES_DIR\"\n\nfind_tool() {\n  TOOL_NAME=\"$1\"\n  for CANDIDATE in \"/opt/homebrew/bin/$TOOL_NAME\" \"/usr/local/bin/$TOOL_NAME\"; do\n    if [ -x \"$CANDIDATE\" ]; then\n      echo \"$CANDIDATE\"\n      return 0\n    fi\n  done\n  command -v \"$TOOL_NAME\" 2>/dev/null || true\n}\n\nis_system_dependency() {\n  DEPENDENCY=\"$1\"\n  case \"$DEPENDENCY\" in\n    \"\"|@*|/System/*|/usr/lib/*)\n      return 0\n      ;;\n    *)\n      return 1\n      ;;\n  esac\n}\n\ncopy_dependencies_for() {\n  SOURCE_FILE=\"$1\"\n  otool -L \"$SOURCE_FILE\" | tail -n +2 | awk '{print $1}' | while read -r DEPENDENCY; do\n    if is_system_dependency \"$DEPENDENCY\"; then\n      continue\n    fi\n\n    if [ ! -f \"$DEPENDENCY\" ]; then\n      echo \"warning: dependency not found: $DEPENDENCY\"\n      continue\n    fi\n\n    BASENAME=\"$(basename \"$DEPENDENCY\")\"\n    DESTINATION=\"$RESOURCES_DIR/$BASENAME\"\n\n    if [ ! -f \"$DESTINATION\" ]; then\n      cp \"$DEPENDENCY\" \"$DESTINATION\"\n      chmod 755 \"$DESTINATION\"\n      /usr/bin/xattr -cr \"$DESTINATION\" || true\n      echo \"Bundled dependency $BASENAME\"\n      copy_dependencies_for \"$DESTINATION\"\n    fi\n  done\n}\n\nrewrite_load_paths_for() {\n  TARGET_FILE=\"$1\"\n  otool -L \"$TARGET_FILE\" | tail -n +2 | awk '{print $1}' | while read -r DEPENDENCY; do\n    if is_system_dependency \"$DEPENDENCY\"; then\n      continue\n    fi\n\n    BASENAME=\"$(basename \"$DEPENDENCY\")\"\n    install_name_tool -change \"$DEPENDENCY\" \"@loader_path/$BASENAME\" \"$TARGET_FILE\" 2>/dev/null || true\n  done\n\n  case \"$TARGET_FILE\" in\n    *.dylib)\n      install_name_tool -id \"@loader_path/$(basename \"$TARGET_FILE\")\" \"$TARGET_FILE\" 2>/dev/null || true\n      ;;\n  esac\n}\n\nfor TOOL in ffmpeg ffprobe; do\n  SOURCE_PATH=\"$(find_tool \"$TOOL\")\"\n  if [ -z \"$SOURCE_PATH\" ]; then\n    echo \"warning: $TOOL not found. Install ffmpeg with Homebrew before making a distributable app.\"\n    continue\n  fi\n\n  cp \"$SOURCE_PATH\" \"$RESOURCES_DIR/$TOOL\"\n  chmod 755 \"$RESOURCES_DIR/$TOOL\"\n  /usr/bin/xattr -cr \"$RESOURCES_DIR/$TOOL\" || true\n  echo \"Bundled $TOOL from $SOURCE_PATH\"\n  copy_dependencies_for \"$RESOURCES_DIR/$TOOL\"\ndone\n\nfor TARGET_FILE in \"$RESOURCES_DIR\"/ffmpeg \"$RESOURCES_DIR\"/ffprobe \"$RESOURCES_DIR\"/*.dylib; do\n  if [ -f \"$TARGET_FILE\" ]; then\n    rewrite_load_paths_for \"$TARGET_FILE\"\n  fi\ndone\n\nfor TARGET_FILE in \"$RESOURCES_DIR\"/ffmpeg \"$RESOURCES_DIR\"/ffprobe \"$RESOURCES_DIR\"/*.dylib; do\n  if [ -f \"$TARGET_FILE\" ]; then\n    codesign --force --sign - \"$TARGET_FILE\" >/dev/null 2>&1 || true\n  fi\ndone\n";
