plugins { id 'com.android.application' }
def signingFile = System.getenv('COOLPLAYER_SIGNING_PROPERTIES')
def releaseKeys = new Properties()
if (signingFile) { file(signingFile).withReader('UTF-8') { releaseKeys.load(it) } }
android {
    namespace 'com.coolplayer.android'
    compileSdk 36
    defaultConfig {
        applicationId (project.hasProperty('compatibilityPackage') ? 'io.github.hun8902.coolplayer.limited' : 'com.coolplayer.android')
        minSdk 27
        targetSdk 36
        versionCode 20
        versionName '1.4.15'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (signingFile) {
            release {
                storeFile file(releaseKeys['storeFile'])
                storePassword releaseKeys['storePassword']
                keyAlias releaseKeys['keyAlias']
                keyPassword releaseKeys['keyPassword']
            }
        }
    }
    buildTypes { release {
        minifyEnabled false
        if (signingFile) signingConfig signingConfigs.release
    } }
}
dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.window:window-java:1.4.0'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.media3:media3-exoplayer:1.9.3'
    implementation 'androidx.media3:media3-session:1.9.3'
}
